[package]
name = "monitoring-anything"
version = "0.1.0"
description = "Monitoring Anything: projects, milestones and live progress monitoring"
authors = ["Yang"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "monitoring_anything_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify = "8"
notify-debouncer-mini = "0.7"
which = "8"
iana-time-zone = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
