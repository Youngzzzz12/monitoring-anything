name: Build and test

# Run by hand (Actions -> Build and test), or by the release workflow when a version tag is pushed.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install pytest
      - name: Frontend checks
        run: |
          npm run typecheck
          npm test
      - name: Collector tests
        run: python -m pytest -q -p no:cacheprovider collector/tools/tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # Installers are not code-signed yet; the update bundles are signed with the updater key (repository secret
      # TAURI_SIGNING_PRIVATE_KEY, a key without password) so installed apps accept them.
      - name: Build bundles
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Sign, check and compress the macOS app
        if: runner.os == 'macOS'
        run: node scripts/macos-package.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-anything-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn
