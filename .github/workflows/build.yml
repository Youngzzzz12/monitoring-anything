name: Build and test

# Manual for now; releases (signing, notarisation, publishing) are a later milestone.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install pytest
      - name: Frontend checks
        run: |
          npm run typecheck
          npm test
      - name: Collector tests
        run: python -m pytest -q -p no:cacheprovider collector/tools/tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned bundles
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-anything-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
